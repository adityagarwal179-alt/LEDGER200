<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerPro - Professional Business & Billing Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- jsPDF for Professional Invoice & Statement Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Application Root Container -->
    <div id="app" class="flex-grow flex flex-col">
        <div class="flex items-center justify-center flex-grow p-4">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-2"></div>
                <p class="text-slate-500 text-sm">Loading LedgerPro Suite...</p>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const MERCHANT_UPI = 'adityaagarwal17092004@oksbi';
        const STORAGE_KEY_PARTIES = 'ledger_parties_v8';
        const STORAGE_KEY_TXNS = 'ledger_txns_v8';

        function getParties() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY_PARTIES)) || []; } catch(e) { return []; }
        }
        function getTxns() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY_TXNS)) || []; } catch(e) { return []; }
        }
        function saveParties(data) { localStorage.setItem(STORAGE_KEY_PARTIES, JSON.stringify(data)); }
        function saveTxns(data) { localStorage.setItem(STORAGE_KEY_TXNS, JSON.stringify(data)); }

        window.addEventListener('DOMContentLoaded', initRouter);
        window.addEventListener('hashchange', initRouter);

        function initRouter() {
            const hash = window.location.hash;
            const app = document.getElementById('app');
            
            if (hash.startsWith('#data=')) {
                const encodedData = hash.replace('#data=', '');
                try {
                    const partyData = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
                    renderCustomerView(partyData, app);
                } catch(err) {
                    app.innerHTML = renderErrorBox("Invalid or Corrupted Link! Please request a fresh link from the merchant.");
                }
            } else {
                renderAdminView(app);
            }
        }

        function renderErrorBox(msg) {
            return `
                <div class="flex-grow flex items-center justify-center p-4">
                    <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center max-w-sm w-full shadow-sm">
                        <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="alert-circle"></i></div>
                        <h2 class="font-bold text-slate-800 text-lg mb-1">Access Notice</h2>
                        <p class="text-xs text-slate-500 mb-4">${msg}</p>
                        <a href="./" class="block bg-slate-900 text-white py-2.5 rounded-xl text-sm font-medium">Return Home</a>
                    </div>
                </div>`;
        }

        function renderAdminView(container) {
            const parties = getParties();
            const txns = getTxns();

            const totalGiven = txns.filter(t => t.type === 'given').reduce((acc, t) => acc + Number(t.amount), 0);
            const totalGot = txns.filter(t => t.type === 'got').reduce((acc, t) => acc + Number(t.amount), 0);

            container.innerHTML = `
                <header class="bg-slate-900 text-white shadow-sm">
                    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
                        <h1 class="font-bold text-lg flex items-center gap-2"><i data-lucide="briefcase" class="text-indigo-400"></i> LedgerPro Professional</h1>
                        <div class="flex items-center gap-2">
                            <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> Backup</button>
                            <label class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5 cursor-pointer">
                                <i data-lucide="upload" class="w-3.5 h-3.5"></i> Restore <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
                            </label>
                        </div>
                    </div>
                </header>
                <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
                    <!-- Quick Analytics Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total Parties</p>
                            <h2 class="text-2xl font-bold text-slate-800">${parties.length}</h2>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total Given (-)</p>
                            <h2 class="text-2xl font-bold text-rose-600">₹${totalGiven}</h2>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total Got (+)</p>
                            <h2 class="text-2xl font-bold text-emerald-600">₹${totalGot}</h2>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Add Party -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-1">
                            <h2 class="font-semibold text-slate-800 mb-4 text-sm flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4 text-indigo-600"></i> Add Party</h2>
                            <form id="party-form" class="space-y-3">
                                <input type="text" id="p-name" placeholder="Party Name" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <input type="text" id="p-phone" placeholder="Phone Number" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl text-sm transition">Create Party</button>
                            </form>
                        </div>
                        <!-- Record Professional Entry & GST -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-2">
                            <h2 class="font-semibold text-slate-800 mb-4 text-sm flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i> Record Professional Entry & GST</h2>
                            <form id="txn-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <select id="t-party" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="">Select Party</option>
                                    ${parties.map(p => `<option value="${p.id}">${p.name} (${p.phone})</option>`).join('')}
                                </select>
                                <input type="number" id="t-amount" placeholder="Total Amount (₹)" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <select id="t-type" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="given">You Gave (-)</option>
                                    <option value="got">You Got (+)</option>
                                </select>
                                <input type="text" id="t-desc" placeholder="Item Name / Bill No." required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <select id="t-gst" class="sm:col-span-2 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="0">GST: 0% (None)</option>
                                    <option value="5">GST: 5%</option>
                                    <option value="12">GST: 12%</option>
                                    <option value="18">GST: 18%</option>
                                    <option value="28">GST: 28%</option>
                                </select>
                                <button type="submit" class="sm:col-span-2 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-xl text-sm transition">Save Entry & Generate Invoice</button>
                            </form>
                        </div>
                    </div>

                    <!-- Party List & Search -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-3">
                            <span class="font-semibold text-slate-700 text-sm">Parties & Secure Links</span>
                            <input type="text" id="search-party" placeholder="Search by name/phone..." oninput="filterParties(this.value)" class="border border-slate-300 rounded-xl px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-64">
                        </div>
                        <div id="party-list-container" class="divide-y divide-slate-100">
                            ${renderPartyList(parties, txns)}
                        </div>
                    </div>
                </main>
            `;
            lucide.createIcons();

            document.getElementById('party-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('p-name').value.trim();
                const phone = document.getElementById('p-phone').value.trim();
                const pin = Math.floor(100000 + Math.random() * 900000).toString();

                parties.push({ id: Date.now(), name, phone, pin });
                saveParties(parties);
                initRouter();
            });

            document.getElementById('txn-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const partyId = Number(document.getElementById('t-party').value);
                const amount = Number(document.getElementById('t-amount').value);
                const type = document.getElementById('t-type').value;
                const description = document.getElementById('t-desc').value.trim();
                const gst = Number(document.getElementById('t-gst').value);
                const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

                txns.push({ id: Date.now(), partyId, amount, type, description, gst, date });
                saveTxns(txns);
                alert("Entry saved successfully!");
                initRouter();
            });
        }

        function renderPartyList(parties, txns, filter = '') {
            const filtered = parties.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()) || p.phone.includes(filter));
            if (filtered.length === 0) return '<p class="p-6 text-center text-slate-400 text-sm">No parties found.</p>';

            return filtered.map(p => {
                const pTxns = txns.filter(t => t.partyId === p.id);
                const netBal = pTxns.reduce((acc, t) => t.type === 'given' ? acc + Number(t.amount) : acc - Number(t.amount), 0);
                const payload = { id: p.id, name: p.name, phone: p.phone, pin: p.pin, txns: pTxns };
                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                const shareLink = `${window.location.origin}${window.location.pathname}#data=${encoded}`;
                const waText = encodeURIComponent(`Hello ${p.name}, your net balance with us is ₹${Math.abs(netBal)} (${netBal >= 0 ? 'Due' : 'Advance'}). View ledger & pay securely here: ${shareLink}`);
                
                return `
                    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 transition">
                        <div>
                            <h3 class="font-semibold text-slate-800 text-sm">${p.name}</h3>
                            <p class="text-xs text-slate-500">Phone: ${p.phone} | PIN: <code class="bg-slate-100 text-indigo-600 font-bold px-1.5 py-0.5 rounded">${p.pin}</code> | Balance: <span class="font-bold ${netBal >= 0 ? 'text-rose-600' : 'text-emerald-600'}">₹${Math.abs(netBal)}</span></p>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <a href="https://wa.me/91${p.phone}?text=${waText}" target="_blank" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 border border-emerald-200">
                                <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> Remind WhatsApp
                            </a>
                            <button onclick="navigator.clipboard.writeText('${shareLink}'); alert('Secure link copied for ${p.name}!');" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Link
                            </button>
                            <button onclick="editParty(${p.id})" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition" title="Edit"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteParty(${p.id})" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterParties(query) {
            const parties = getParties();
            const txns = getTxns();
            document.getElementById('party-list-container').innerHTML = renderPartyList(parties, txns, query);
            lucide.createIcons();
        }

        function editParty(id) {
            let parties = getParties();
            let p = parties.find(item => item.id === id);
            if (!p) return;
            let newName = prompt("Edit Party Name:", p.name);
            if (newName === null) return;
            let newPhone = prompt("Edit Phone Number:", p.phone);
            if (newPhone === null) return;
            let newPin = prompt("Edit 6-Digit PIN:", p.pin);
            if (newPin === null) return;

            p.name = newName.trim() || p.name;
            p.phone = newPhone.trim() || p.phone;
            p.pin = newPin.trim() || p.pin;
            saveParties(parties);
            initRouter();
        }

        function deleteParty(id) {
            if (!confirm("Delete this party and all related records?")) return;
            saveParties(getParties().filter(p => p.id !== id));
            saveTxns(getTxns().filter(t => t.partyId !== id));
            initRouter();
        }

        function exportData() {
            const data = { parties: getParties(), txns: getTxns() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ledger_backup_${Date.now()}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.parties && data.txns) {
                        saveParties(data.parties);
                        saveTxns(data.txns);
                        alert("Data restored successfully!");
                        initRouter();
                    } else { alert("Invalid format!"); }
                } catch(err) { alert("Error reading file!"); }
            };
            reader.readAsText(file);
        }

        function renderCustomerView(partyData, container) {
            const authKey = `auth_${partyData.phone}`;
            const verified = sessionStorage.getItem(authKey) === 'true';

            if (!verified) {
                container.innerHTML = `
                    <div class="flex-grow flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl border border-slate-200 max-w-sm w-full shadow-sm">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="lock"></i></div>
                            <h2 class="font-bold text-slate-800 text-center mb-1">Customer Secure Portal</h2>
                            <p class="text-xs text-slate-500 text-center mb-4">Enter 6-digit PIN provided by <b>${partyData.name}</b></p>
                            <form id="pin-form" class="space-y-3">
                                <input type="password" id="pin-box" maxlength="6" placeholder="******" required class="w-full text-center tracking-widest text-lg border border-slate-300 rounded-xl py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                                <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-medium">Verify PIN</button>
                            </form>
                            <p id="pin-err" class="text-rose-500 text-xs text-center mt-2 hidden">Incorrect PIN!</p>
                        </div>
                    </div>`;
                lucide.createIcons();
                
                document.getElementById('pin-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    if (document.getElementById('pin-box').value.trim() === String(partyData.pin)) {
                        sessionStorage.setItem(authKey, 'true');
                        renderCustomerView(partyData, container);
                    } else { document.getElementById('pin-err').classList.remove('hidden'); }
                });
                return;
            }

            const txns = partyData.txns || [];
            const netBalance = txns.reduce((acc, t) => t.type === 'given' ? acc + Number(t.amount) : acc - Number(t.amount), 0);
            const absBalance = Math.abs(netBalance);
            const upiLink = `upi://pay?pa=${MERCHANT_UPI}&pn=Merchant&am=${absBalance}&cu=INR`;

            container.innerHTML = `
                <header class="bg-slate-900 text-white shadow-sm">
                    <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div>
                            <h1 class="font-bold text-sm">${partyData.name}</h1>
                            <p class="text-xs text-slate-400">Professional Digital Ledger</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="downloadStatement('${partyData.name}', ${JSON.stringify(txns).replace(/"/g, '&quot;')})" class="text-xs bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-lg text-white font-medium flex items-center gap-1"><i data-lucide="download" class="w-3.5 h-3.5"></i> Statement PDF</button>
                            <button onclick="sessionStorage.removeItem('${authKey}'); location.hash='';" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300">Lock</button>
                        </div>
                    </div>
                </header>
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full space-y-4">
                    <!-- Balance & Payment Card -->
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-5">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Net Balance</p>
                                <h2 class="text-2xl font-bold ${netBalance >= 0 ? 'text-rose-600' : 'text-emerald-600'}">
                                    ${netBalance >= 0 ? '₹' + netBalance + ' (You\'ll Give)' : '₹' + absBalance + ' (You\'ll Get)'}
                                </h2>
                            </div>
                            ${netBalance > 0 ? `
                                <a href="${upiLink}" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm">
                                    <i data-lucide="send" class="w-4 h-4"></i> Pay Now (₹${absBalance})
                                </a>
                            ` : ''}
                        </div>

                        ${netBalance > 0 ? `
                            <div class="border-t border-slate-100 pt-4 flex flex-col items-center justify-center">
                                <p class="text-xs text-slate-500 mb-3 font-medium">Scan QR code to pay via GPay, PhonePe, Paytm</p>
                                <div id="qrcode-box" class="bg-white p-2 border border-slate-200 rounded-xl shadow-xs inline-block"></div>
                                <p class="text-[11px] text-slate-400 mt-2 font-mono">UPI ID: ${MERCHANT_UPI}</p>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Transactions History -->
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <div class="p-4 border-b border-slate-100 font-semibold text-xs text-slate-500 uppercase flex justify-between items-center">
                            <span>Transaction History & GST Invoices</span>
                            <span>Entries: ${txns.length}</span>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${txns.length === 0 ? '<p class="p-6 text-center text-slate-400 text-sm">No transactions found.</p>' : ''}
                            ${txns.map(t => `
                                <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 transition">
                                    <div>
                                        <p class="text-sm font-medium text-slate-800">${t.description || 'General Entry'} ${t.gst ? `<span class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-1.5 py-0.5 rounded ml-1">GST ${t.gst}%</span>` : ''}</p>
                                        <p class="text-xs text-slate-400">${t.date}</p>
                                    </div>
                                    <div class="flex items-center justify-between sm:justify-end gap-3">
                                        <span class="font-bold text-sm ${t.type === 'given' ? 'text-rose-600' : 'text-emerald-600'}">
                                            ${t.type === 'given' ? '-' : '+'}₹${t.amount}
                                        </span>
                                        <button onclick="downloadInvoice('${partyData.name}', ${JSON.stringify(t).replace(/"/g, '&quot;')})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1"><i data-lucide="file-text" class="w-3.5 h-3.5"></i> Invoice</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </main>
            `;
            lucide.createIcons();

            if (netBalance > 0) {
                new QRCode(document.getElementById("qrcode-box"), {
                    text: upiLink,
                    width: 150,
                    height: 150,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        // PDF Statement Generator using jsPDF
        function downloadStatement(partyName, txns) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("LedgerPro Account Statement", 14, 20);
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text(`Party Name: ${partyName}`, 14, 30);
            doc.text(`Generated On: ${new Date().toLocaleDateString()}`, 14, 38);

            let y = 50;
            doc.setFillColor(240, 240, 240);
            doc.rect(14, y, 182, 8, "F");
            doc.setFont("helvetica", "bold");
            doc.text("Date", 18, y + 6);
            doc.text("Description", 55, y + 6);
            doc.text("GST", 130, y + 6);
            doc.text("Amount (INR)", 160, y + 6);

            y += 12;
            doc.setFont("helvetica", "normal");
            txns.forEach(t => {
                doc.text(t.date, 18, y);
                doc.text(t.description || 'Entry', 55, y);
                doc.text(t.gst ? `${t.gst}%` : '0%', 130, y);
                doc.text(`${t.type === 'given' ? '-' : '+'}₹${t.amount}`, 160, y);
                y += 8;
                if (y > 280) { doc.addPage(); y = 20; }
            });
            doc.save(`${partyName}_Statement.pdf`);
        }

        // Single Invoice PDF Generator
        function downloadInvoice(partyName, t) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("TAX INVOICE / RECEIPT", 14, 20);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Merchant UPI: ${MERCHANT_UPI}`, 14, 28);
            doc.text(`Date: ${t.date}`, 14, 34);

            doc.setFillColor(245, 247, 250);
            doc.roundedRect(14, 45, 182, 35, 3, 3, "F");
            doc.setFont("helvetica", "bold");
            doc.text("Bill To:", 20, 54);
            doc.setFont("helvetica", "normal");
            doc.text(`Customer Name: ${partyName}`, 20, 62);

            let y = 90;
            doc.setFont("helvetica", "bold");
            doc.text("Item / Description", 18, y);
            doc.text("GST Rate", 130, y);
            doc.text("Amount", 165, y);
            doc.line(14, y + 3, 196, y + 3);

            y += 12;
            doc.setFont("helvetica", "normal");
            doc.text(t.description || 'General Service', 18, y);
            doc.text(t.gst ? `${t.gst}%` : '0%', 130, y);
            doc.text(`₹${t.amount}`, 165, y);

            doc.line(14, y + 10, 196, y + 10);
            doc.setFont("helvetica", "bold");
            doc.text(`Total Amount: ₹${t.amount}`, 130, y + 20);

            doc.save(`Invoice_${t.id}.pdf`);
        }
    </script>
