<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerPro - Professional Ledger & UPI Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Application Root Container -->
    <div id="app" class="flex-grow flex flex-col">
        <div class="flex items-center justify-center flex-grow p-4">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-2"></div>
                <p class="text-slate-500 text-sm">Loading LedgerPro Portal...</p>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const MERCHANT_UPI = 'adityaagarwal17092004@oksbi';
        const STORAGE_KEY_PARTIES = 'ledger_parties_v5';
        const STORAGE_KEY_TXNS = 'ledger_txns_v5';

        function getParties() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY_PARTIES)) || []; } catch(e) { return []; }
        }
        function getTxns() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY_TXNS)) || []; } catch(e) { return []; }
        }
        function saveParties(data) { localStorage.setItem(STORAGE_KEY_PARTIES, JSON.stringify(data)); }
        function saveTxns(data) { localStorage.setItem(STORAGE_KEY_TXNS, JSON.stringify(data)); }

        window.addEventListener('DOMContentLoaded', initRouter);
        window.addEventListener('hashchange', initRouter);

        function initRouter() {
            const hash = window.location.hash;
            const app = document.getElementById('app');
            
            if (hash.startsWith('#data=')) {
                const encodedData = hash.replace('#data=', '');
                try {
                    const partyData = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
                    
                    // Sync party and transactions into local storage automatically
                    let parties = getParties();
                    if (!parties.some(p => p.phone === partyData.phone)) {
                        parties.push({ id: partyData.id, name: partyData.name, phone: partyData.phone, pin: partyData.pin });
                        saveParties(parties);
                    }
                    if (partyData.txns && partyData.txns.length > 0) {
                        let txns = getTxns();
                        partyData.txns.forEach(t => {
                            if (!txns.some(existing => existing.id === t.id)) {
                                txns.push(t);
                            }
                        });
                        saveTxns(txns);
                    }

                    renderCustomerView(partyData, app);
                } catch(err) {
                    app.innerHTML = renderErrorBox("Invalid Link Structure! Please request a fresh link from the merchant.");
                }
            } else {
                renderAdminView(app);
            }
        }

        function renderErrorBox(msg) {
            return `
                <div class="flex-grow flex items-center justify-center p-4">
                    <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center max-w-sm w-full shadow-sm">
                        <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="alert-circle"></i></div>
                        <h2 class="font-bold text-slate-800 text-lg mb-1">Access Notice</h2>
                        <p class="text-xs text-slate-500 mb-4">${msg}</p>
                        <a href="./" class="block bg-slate-900 text-white py-2.5 rounded-xl text-sm font-medium">Return Home</a>
                    </div>
                </div>`;
        }

        function renderAdminView(container) {
            const parties = getParties();
            const txns = getTxns();

            container.innerHTML = `
                <header class="bg-slate-900 text-white shadow-sm">
                    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                        <h1 class="font-bold text-lg flex items-center gap-2"><i data-lucide="book-open" class="text-indigo-400"></i> LedgerPro Admin</h1>
                        <span class="text-xs bg-slate-800 text-indigo-300 px-2.5 py-1 rounded-full border border-slate-700">UPI: ${MERCHANT_UPI}</span>
                    </div>
                </header>
                <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Add Party -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-1">
                            <h2 class="font-semibold text-slate-800 mb-4 text-sm flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4 text-indigo-600"></i> Add Party</h2>
                            <form id="party-form" class="space-y-3">
                                <input type="text" id="p-name" placeholder="Party Name" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <input type="text" id="p-phone" placeholder="Phone Number" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl text-sm transition">Create & Get Link</button>
                            </form>
                        </div>
                        <!-- Add Transaction -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-2">
                            <h2 class="font-semibold text-slate-800 mb-4 text-sm flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i> Record Entry</h2>
                            <form id="txn-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <select id="t-party" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="">Select Party</option>
                                    ${parties.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                                </select>
                                <input type="number" id="t-amount" placeholder="Amount (₹)" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <select id="t-type" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="given">You Gave (-)</option>
                                    <option value="got">You Got (+)</option>
                                </select>
                                <input type="text" id="t-desc" placeholder="Description / Bill No." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                                <button type="submit" class="sm:col-span-2 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-xl text-sm transition">Save Transaction</button>
                            </form>
                        </div>
                    </div>

                    <!-- Party List Table -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 border-b border-slate-100 font-semibold text-slate-700 text-sm">Registered Parties & WhatsApp Share Links</div>
                        <div class="divide-y divide-slate-100">
                            ${parties.length === 0 ? '<p class="p-6 text-center text-slate-400 text-sm">No parties added yet.</p>' : ''}
                            ${parties.map(p => {
                                const pTxns = txns.filter(t => t.partyId === p.id);
                                const payload = {
                                    id: p.id,
                                    name: p.name,
                                    phone: p.phone,
                                    pin: p.pin,
                                    txns: pTxns
                                };
                                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                                const shareLink = `${window.location.origin}${window.location.pathname}#data=${encoded}`;
                                
                                return `
                                    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 transition">
                                        <div>
                                            <h3 class="font-semibold text-slate-800 text-sm">${p.name}</h3>
                                            <p class="text-xs text-slate-500">Phone: ${p.phone} | PIN: <code class="bg-slate-100 text-indigo-600 font-bold px-1.5 py-0.5 rounded">${p.pin}</code> | Entries: ${pTxns.length}</p>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="navigator.clipboard.writeText('${shareLink}'); alert('WhatsApp link copied successfully! Send it to ${p.name}.');" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 border border-emerald-200">
                                                <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Copy WhatsApp Link
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </main>
            `;
            lucide.createIcons();

            document.getElementById('party-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('p-name').value.trim();
                const phone = document.getElementById('p-phone').value.trim();
                const pin = Math.floor(100000 + Math.random() * 900000).toString();

                parties.push({ id: Date.now(), name, phone, pin });
                saveParties(parties);
                initRouter();
            });

            document.getElementById('txn-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const partyId = Number(document.getElementById('t-party').value);
                const amount = Number(document.getElementById('t-amount').value);
                const type = document.getElementById('t-type').value;
                const description = document.getElementById('t-desc').value.trim();
                const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

                txns.push({ id: Date.now(), partyId, amount, type, description, date });
                saveTxns(txns);
                initRouter();
            });
        }

        function renderCustomerView(partyData, container) {
            const authKey = `auth_${partyData.phone}`;
            const verified = sessionStorage.getItem(authKey) === 'true';

            if (!verified) {
                container.innerHTML = `
                    <div class="flex-grow flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl border border-slate-200 max-w-sm w-full shadow-sm">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="lock"></i></div>
                            <h2 class="font-bold text-slate-800 text-center mb-1">Customer Portal</h2>
                            <p class="text-xs text-slate-500 text-center mb-4">Enter 6-digit PIN for <b>${partyData.name}</b></p>
                            <form id="pin-form" class="space-y-3">
                                <input type="password" id="pin-box" maxlength="6" placeholder="******" required class="w-full text-center tracking-widest text-lg border border-slate-300 rounded-xl py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                                <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-medium">Verify PIN</button>
                            </form>
                            <p id="pin-err" class="text-rose-500 text-xs text-center mt-2 hidden">Incorrect PIN!</p>
                        </div>
                    </div>`;
                lucide.createIcons();
                
                document.getElementById('pin-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    if (document.getElementById('pin-box').value.trim() === String(partyData.pin)) {
                        sessionStorage.setItem(authKey, 'true');
                        renderCustomerView(partyData, container);
                    } else {
                        document.getElementById('pin-err').classList.remove('hidden');
                    }
                });
                return;
            }

            const txns = partyData.txns || [];
            const netBalance = txns.reduce((acc, t) => t.type === 'given' ? acc + Number(t.amount) : acc - Number(t.amount), 0);
            const upiLink = `upi://pay?pa=${MERCHANT_UPI}&pn=Merchant&am=${Math.abs(netBalance)}&cu=INR`;

            container.innerHTML = `
                <header class="bg-slate-900 text-white shadow-sm">
                    <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div>
                            <h1 class="font-bold text-sm">${partyData.name}</h1>
                            <p class="text-xs text-slate-400">Live Secure Ledger</p>
                        </div>
                        <button onclick="sessionStorage.removeItem('${authKey}'); location.hash='';" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300">Lock Session</button>
                    </div>
                </header>
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full space-y-4">
                    <!-- Balance & Pay Now Card -->
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Net Balance</p>
                            <h2 class="text-2xl font-bold ${netBalance >= 0 ? 'text-rose-600' : 'text-emerald-600'}">
                                ${netBalance >= 0 ? '₹' + netBalance + ' (You\'ll Give)' : '₹' + Math.abs(netBalance) + ' (You\'ll Get)'}
                            </h2>
                        </div>
                        ${netBalance > 0 ? `
                            <a href="${upiLink}" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm">
                                <i data-lucide="send" class="w-4 h-4"></i> Pay Now (₹${netBalance})
                            </a>
                        ` : ''}
                    </div>

                    <!-- Transactions History -->
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <div class="p-4 border-b border-slate-100 font-semibold text-xs text-slate-500 uppercase flex justify-between items-center">
                            <span>Transaction History</span>
                            <span>Total Entries: ${txns.length}</span>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${txns.length === 0 ? '<p class="p-6 text-center text-slate-400 text-sm">No transactions found.</p>' : ''}
                            ${txns.map(t => `
                                <div class="p-4 flex justify-between items-center hover:bg-slate-50 transition">
                                    <div>
                                        <p class="text-sm font-medium text-slate-800">${t.description || 'General Entry'}</p>
                                        <p class="text-xs text-slate-400">${t.date}</p>
                                    </div>
                                    <span class="font-bold text-sm ${t.type === 'given' ? 'text-rose-600' : 'text-emerald-600'}">
                                        ${t.type === 'given' ? '-' : '+'}₹${t.amount}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </main>
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
